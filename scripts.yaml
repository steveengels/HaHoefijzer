set_ev_charger_current:
  mode: queued
  fields:
    amps:
      name: Amps
      description: Current limit for the Alfen charger.
      selector:
        number:
          min: 6
          max: 16
          step: 1
          unit_of_measurement: A
  sequence:
  - variables:
      requested_amps: '{{ amps | int(8) }}'
      safe_amps: '{{ [16, [6, requested_amps] | max] | min }}'
  - service: number.set_value
    target:
      entity_id: number.alfen_max_station_current_2
    data:
      value: '{{ safe_amps }}'

start_airco_cycle:
  alias: Start airco koelcyclus
  description: Stel een airco in op koelen en start de bijbehorende uitschakeltimer.
  mode: parallel
  max: 3
  fields:
    climate_entity:
      name: Airco
      required: true
      selector:
        entity:
          domain: climate
    timer_entity:
      name: Timer
      required: true
      selector:
        entity:
          domain: timer
    target_temperature:
      name: Doeltemperatuur
      required: true
      selector:
        number:
          min: 16
          max: 30
          step: 1
          unit_of_measurement: "°C"
    runtime:
      name: Looptijd
      required: true
      selector:
        text:
  sequence:
  - service: climate.set_temperature
    target:
      entity_id: '{{ climate_entity }}'
    data:
      temperature: '{{ target_temperature | int }}'
      hvac_mode: cool
  - service: timer.start
    target:
      entity_id: '{{ timer_entity }}'
    data:
      duration: '{{ runtime }}'

play_radio_minerva_hobbyruimte:
  alias: Speel Radio Minerva in hobbyruimte
  icon: mdi:radio
  mode: restart
  sequence:
    - action: media_player.play_media
      target:
        entity_id: media_player.hobbyruimte
      data:
        media_content_id: media-source://radio_browser/29c3799c-d7b8-49e0-a47c-143da177b90e
        media_content_type: audio/mpeg

