- alias: Laadpaal smart vermogen
  id: laadpaal_smart_vermogen
  description: Adjust the Alfen charger current using mode, solar export, battery
    reserve, time, and jacuzzi priority.
  triggers:
  - platform: time_pattern
    minutes: /5
  - platform: time
    at:
    - 00:00:00
    - '18:00:00'
  - platform: state
    entity_id:
    - input_select.ev_charging_mode
    - input_number.ev_charging_battery_reserve
    - binary_sensor.hoefijzer_spa_in_use
    - timer.timer_jacuzzi
    - sensor.jk_bms_id_512_charge
  - platform: numeric_state
    entity_id: sensor.grid_power_2_minute_average
    above: 900
  - platform: numeric_state
    entity_id: sensor.grid_power_w
    above: 8000
  - platform: numeric_state
    entity_id: sensor.grid_power_2_minute_average
    below: -700
  action:
  - if:
    - condition: state
      entity_id: binary_sensor.hoefijzer_spa_in_use
      state: 'on'
    then:
    - service: timer.start
      target:
        entity_id: timer.timer_jacuzzi
  - variables:
      mode: '{{ states(''input_select.ev_charging_mode'') }}'
      grid_power_w: '{{ states(''sensor.grid_power_2_minute_average'') | float(0)
        }}'
      instant_grid_power_w: '{{ states(''sensor.grid_power_w'') | float(0) }}'
      battery_soc: '{{ states(''sensor.jk_bms_id_512_charge'') | float(0) }}'
      battery_reserve: '{{ states(''input_number.ev_charging_battery_reserve'') |
        float(55) }}'
      current_limit: '{{ states(''number.alfen_max_station_current_2'') | float(8)
        }}'
      jacuzzi_priority: "{{ is_state('binary_sensor.hoefijzer_spa_in_use', 'on')\n
        \  or not is_state('timer.timer_jacuzzi', 'idle') }}\n"
      solar_amps: "{% if grid_power_w < -4200 %}\n  16\n{% elif grid_power_w < -3200
        %}\n  14\n{% elif grid_power_w < -2300 %}\n  12\n{% elif grid_power_w < -1500
        %}\n  10\n{% elif grid_power_w < -1300 %}\n  8\n{% elif grid_power_w < -700
        %}\n  6\n{% elif grid_power_w > 900 %}\n  {{ [6, current_limit - 2] | max
        | int }}\n{% else %}\n  {{ current_limit | int }}\n{% endif %}\n"
      target_amps: "{% if instant_grid_power_w > 8000 %}\n  6\n{% elif jacuzzi_priority
        %}\n  8\n{% elif mode == 'Paused' %}\n  6\n{% elif mode == 'Boost' %}\n  16\n{%
        elif mode == 'Normal' %}\n  {{ 16 if now().hour < 18 else 8 }}\n{% elif mode
        == 'Solar' %}\n  {{ 6 if battery_soc < battery_reserve else solar_amps | int
        }}\n{% else %}\n  8\n{% endif %}\n"
  - condition: template
    value_template: '{{ target_amps | int != current_limit | int }}'
  - service: script.set_ev_charger_current
    data:
      amps: '{{ target_amps | int }}'
  mode: restart
