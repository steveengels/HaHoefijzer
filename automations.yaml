- alias: Airco Bureau - Start koelen boven 25°C
  id: airco_bureau_startkoelen
  description: Koel het bureau alleen bij aanhoudende warmte en nooit na 19:00.
  trigger:
  - platform: numeric_state
    entity_id: sensor.aircobureau_climatecontrol_room_temperature
    above: 25
    for: 00:10:00
  - platform: time_pattern
    minutes: 0
  - platform: state
    entity_id: input_select.airco_mode
  condition:
  - condition: template
    value_template: "{% set threshold = 24 if is_state('input_select.airco_mode',
      'Comfort') else 23 if is_state('input_select.airco_mode', 'Boost') else 25 %}
      {{ not is_state('input_select.airco_mode', 'Off')\n   and states('sensor.aircobureau_climatecontrol_room_temperature')
      | float(0) > threshold }}\n"
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.aircobureau_room_temperature
      state: cool
  - condition: time
    after: 06:59:59
    before: '19:00:00'
  action:
  - variables:
      target_temperature: '{{ 21 if is_state(''input_select.airco_mode'', ''Boost'')
        else 22 if is_state(''input_select.airco_mode'', ''Comfort'') else 23 }}'
      runtime: '{{ ''01:00:00'' if is_state(''input_select.airco_mode'', ''Boost'')
        else ''00:45:00'' if is_state(''input_select.airco_mode'', ''Comfort'') else
        ''00:30:00'' }}'
  - service: script.start_airco_cycle
    data:
      climate_entity: climate.aircobureau_room_temperature
      timer_entity: timer.timer_airco_bureau_koelen
      target_temperature: '{{ target_temperature }}'
      runtime: '{{ runtime }}'
  mode: single
